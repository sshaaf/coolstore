version: 2
updates:
  # Maven dependencies
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    reviewers:
      - "sshaaf"
    assignees:
      - "sshaaf"
    commit-message:
      prefix: "[deps]"
      include: "scope"
    # Group Quarkus updates together
    groups:
      quarkus:
        patterns:
          - "io.quarkus*"
        update-types:
          - "minor"
          - "patch"
      test-dependencies:
        patterns:
          - "org.junit*"
          - "org.mockito*"
          - "io.rest-assured*"
          - "org.assertj*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore major version updates for core dependencies
      - dependency-name: "io.quarkus.platform:quarkus-bom"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "[ci]"
      include: "scope"

  # Docker dependencies (if Dockerfile exists)
  - package-ecosystem: "docker"
    directory: "/src/main/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "[docker]"
      include: "scope"
