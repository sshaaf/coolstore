name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - quarkus-migration

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx2g -XX:MaxMetaspaceSize=512m'
  MAVEN_CLI_OPTS: '--batch-mode --errors --fail-at-end --show-version'

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compile
        run: mvn ${{ env.MAVEN_CLI_OPTS }} clean compile

      - name: Run tests
        run: |
          mvn ${{ env.MAVEN_CLI_OPTS }} test \
            -Dnet.bytebuddy.experimental=true \
            -Djava.util.logging.manager=org.jboss.logmanager.LogManager

      - name: Generate JaCoCo Report
        run: mvn ${{ env.MAVEN_CLI_OPTS }} jacoco:report

      - name: Check code coverage
        run: mvn ${{ env.MAVEN_CLI_OPTS }} jacoco:check

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build JAR
        run: mvn ${{ env.MAVEN_CLI_OPTS }} package -DskipTests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coolstore-quarkus-jar
          path: target/coolstore-quarkus.jar
          retention-days: 5

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 5

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: target

      - name: Verify quality gates
        run: |
          echo "Verifying quality gates..."

          # Check if coverage report exists
          if [ ! -f "target/site/jacoco/jacoco.xml" ]; then
            echo "ERROR: Coverage report not found"
            exit 1
          fi

          # Check if test results exist
          if [ ! -d "target/surefire-reports" ]; then
            echo "ERROR: Test results not found"
            exit 1
          fi

          echo "Quality gates validation complete"

  status-check:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [build, quality-gates]
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Build job failed"
            exit 1
          fi

          if [ "${{ needs.quality-gates.result }}" != "success" ]; then
            echo "Quality gates job failed"
            exit 1
          fi

          echo "All CI checks passed successfully!"
