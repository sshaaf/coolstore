name: Deploy to Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  MAVEN_CLI_OPTS: '--batch-mode --errors --fail-at-end --show-version'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/coolstore-quarkus

jobs:
  build-and-push:
    name: Build and Push Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build application
        run: mvn ${{ env.MAVEN_CLI_OPTS }} clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=staging-latest

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging
      url: https://staging.coolstore.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure Kubernetes context
        run: |
          # Configure kubectl with staging cluster credentials
          # This is a placeholder - adjust based on your K8s setup
          echo "Configuring kubectl for staging cluster..."
          # Example: kubectl config use-context staging-cluster

      - name: Update deployment
        run: |
          # Update the deployment with new image
          IMAGE_TAG="${{ needs.build-and-push.outputs.image-tag }}"
          echo "Deploying image: $IMAGE_TAG"

          # Example deployment update
          # kubectl set image deployment/coolstore-quarkus coolstore-quarkus=$IMAGE_TAG -n staging
          # kubectl rollout status deployment/coolstore-quarkus -n staging

          echo "Deployment configuration updated"

      - name: Wait for rollout
        run: |
          echo "Waiting for rollout to complete..."
          # kubectl rollout status deployment/coolstore-quarkus -n staging --timeout=300s

  smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for application ready
        run: |
          # Wait for application to be healthy
          STAGING_URL="${{ vars.STAGING_URL || 'https://staging.coolstore.example.com' }}"
          echo "Checking application health at $STAGING_URL"

          for i in {1..30}; do
            if curl -f "$STAGING_URL/q/health/ready" 2>/dev/null; then
              echo "Application is ready!"
              break
            fi
            echo "Waiting for application... ($i/30)"
            sleep 10
          done

      - name: Test API endpoints
        run: |
          STAGING_URL="${{ vars.STAGING_URL || 'https://staging.coolstore.example.com' }}"

          # Test products endpoint
          echo "Testing /api/products endpoint..."
          curl -f "$STAGING_URL/api/products" || exit 1

          # Test cart endpoint
          echo "Testing /api/cart endpoint..."
          curl -f "$STAGING_URL/api/cart/test-cart" || exit 1

          # Test health endpoints
          echo "Testing health endpoints..."
          curl -f "$STAGING_URL/q/health/live" || exit 1
          curl -f "$STAGING_URL/q/health/ready" || exit 1

          echo "All smoke tests passed!"

      - name: Run integration tests
        run: |
          STAGING_URL="${{ vars.STAGING_URL || 'https://staging.coolstore.example.com' }}"
          echo "Running integration tests against $STAGING_URL"

          # Add integration test execution here
          # Example: mvn verify -Pintegration-test -Dapp.url=$STAGING_URL

  notify:
    name: Send Deployment Notifications
    runs-on: ubuntu-latest
    needs: [deploy-staging, smoke-tests]
    if: always()

    steps:
      - name: Send Slack notification
        if: vars.SLACK_WEBHOOK_URL
        run: |
          STATUS="${{ needs.smoke-tests.result }}"
          COLOR="good"
          if [ "$STATUS" != "success" ]; then
            COLOR="danger"
          fi

          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d "{
              \"attachments\": [{
                \"color\": \"$COLOR\",
                \"title\": \"Staging Deployment: $STATUS\",
                \"text\": \"Commit: ${{ github.sha }}\nBranch: ${{ github.ref_name }}\",
                \"footer\": \"GitHub Actions\",
                \"ts\": $(date +%s)
              }]
            }"

      - name: Create deployment summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Staging Deployment Summary

          ## Status
          - Build and Push: ${{ needs.build-and-push.result }}
          - Deploy Staging: ${{ needs.deploy-staging.result }}
          - Smoke Tests: ${{ needs.smoke-tests.result }}

          ## Details
          - Commit: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          - Image Tag: ${{ needs.build-and-push.outputs.image-tag }}
          - Triggered by: ${{ github.actor }}

          ## Next Steps
          - Review smoke test results
          - Validate staging environment
          - Prepare for production release if ready

          EOF
