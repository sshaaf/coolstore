name: Performance Testing

on:
  pull_request:
    branches:
      - main
      - quarkus-migration
  workflow_dispatch:
    inputs:
      baseline_branch:
        description: 'Baseline branch to compare against'
        required: false
        default: 'main'

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx2g -XX:MaxMetaspaceSize=512m'
  MAVEN_CLI_OPTS: '--batch-mode --errors --fail-at-end --show-version'

jobs:
  jmh-benchmarks:
    name: JMH Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build application
        run: mvn ${{ env.MAVEN_CLI_OPTS }} clean package -DskipTests

      - name: Run JMH benchmarks
        run: |
          mvn ${{ env.MAVEN_CLI_OPTS }} test-compile exec:java \
            -Dexec.mainClass=org.openjdk.jmh.Main \
            -Dexec.classpathScope=test \
            -Dexec.args="-rf json -rff target/jmh-result.json com.redhat.coolstore.benchmarks" || true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: jmh-benchmarks
          path: target/jmh-result.json
          retention-days: 30

  startup-benchmarks:
    name: Startup Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build application
        run: mvn ${{ env.MAVEN_CLI_OPTS }} clean package -DskipTests

      - name: Measure startup time
        run: |
          echo "Running startup benchmark..."

          # Run application and measure startup time
          START=$(date +%s%N)
          timeout 30s java -jar target/coolstore-quarkus.jar &
          APP_PID=$!

          # Wait for application to be ready
          for i in {1..30}; do
            if curl -f http://localhost:8080/q/health/ready 2>/dev/null; then
              END=$(date +%s%N)
              STARTUP_TIME=$(echo "scale=3; ($END - $START) / 1000000000" | bc)
              echo "Startup time: ${STARTUP_TIME}s"
              echo "STARTUP_TIME=${STARTUP_TIME}" >> $GITHUB_ENV
              break
            fi
            sleep 1
          done

          kill $APP_PID 2>/dev/null || true

          # Save results
          mkdir -p benchmark-results
          echo "{\"startup_time_seconds\": ${STARTUP_TIME:-999}}" > benchmark-results/startup-benchmark.json

      - name: Upload startup benchmark
        uses: actions/upload-artifact@v4
        with:
          name: startup-benchmark
          path: benchmark-results/startup-benchmark.json
          retention-days: 30

  memory-benchmarks:
    name: Memory Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build application
        run: mvn ${{ env.MAVEN_CLI_OPTS }} clean package -DskipTests

      - name: Measure memory usage
        run: |
          echo "Running memory benchmark..."

          # Start application with memory tracking
          java -Xmx512m -XX:+PrintGCDetails -jar target/coolstore-quarkus.jar &
          APP_PID=$!

          # Wait for startup
          sleep 15

          # Get memory usage
          MEMORY_RSS=$(ps -o rss= -p $APP_PID | awk '{print $1/1024}')
          echo "Memory RSS: ${MEMORY_RSS}MB"

          kill $APP_PID 2>/dev/null || true

          # Save results
          mkdir -p benchmark-results
          echo "{\"memory_rss_mb\": ${MEMORY_RSS:-999}}" > benchmark-results/memory-benchmark.json

      - name: Upload memory benchmark
        uses: actions/upload-artifact@v4
        with:
          name: memory-benchmark
          path: benchmark-results/memory-benchmark.json
          retention-days: 30

  throughput-tests:
    name: Throughput Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build application
        run: mvn ${{ env.MAVEN_CLI_OPTS }} clean package -DskipTests

      - name: Install Apache Bench
        run: sudo apt-get update && sudo apt-get install -y apache2-utils

      - name: Run throughput test
        run: |
          # Start application
          java -jar target/coolstore-quarkus.jar &
          APP_PID=$!

          # Wait for startup
          sleep 20

          # Run throughput test
          ab -n 10000 -c 100 -g throughput.tsv http://localhost:8080/api/products > throughput-results.txt || true

          # Parse results
          RPS=$(grep "Requests per second" throughput-results.txt | awk '{print $4}')
          echo "Requests per second: ${RPS}"

          kill $APP_PID 2>/dev/null || true

          # Save results
          mkdir -p benchmark-results
          echo "{\"requests_per_second\": ${RPS:-0}}" > benchmark-results/throughput-benchmark.json

      - name: Upload throughput benchmark
        uses: actions/upload-artifact@v4
        with:
          name: throughput-benchmark
          path: benchmark-results/throughput-benchmark.json
          retention-days: 30

  compare-baseline:
    name: Compare with Baseline
    runs-on: ubuntu-latest
    needs: [jmh-benchmarks, startup-benchmarks, memory-benchmarks, throughput-tests]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all benchmarks
        uses: actions/download-artifact@v4
        with:
          path: current-benchmarks

      - name: Compare and comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let comment = '## Performance Benchmark Results\n\n';

            // Read startup benchmark
            try {
              const startup = JSON.parse(fs.readFileSync('current-benchmarks/startup-benchmark/startup-benchmark.json', 'utf8'));
              comment += `### Startup Time\n`;
              comment += `- Current: ${startup.startup_time_seconds}s\n\n`;
            } catch (e) {
              comment += `### Startup Time\n- Error reading results\n\n`;
            }

            // Read memory benchmark
            try {
              const memory = JSON.parse(fs.readFileSync('current-benchmarks/memory-benchmark/memory-benchmark.json', 'utf8'));
              comment += `### Memory Usage\n`;
              comment += `- Current RSS: ${memory.memory_rss_mb}MB\n\n`;
            } catch (e) {
              comment += `### Memory Usage\n- Error reading results\n\n`;
            }

            // Read throughput benchmark
            try {
              const throughput = JSON.parse(fs.readFileSync('current-benchmarks/throughput-benchmark/throughput-benchmark.json', 'utf8'));
              comment += `### Throughput\n`;
              comment += `- Current: ${throughput.requests_per_second} req/s\n\n`;
            } catch (e) {
              comment += `### Throughput\n- Error reading results\n\n`;
            }

            comment += '\n---\n';
            comment += '*Performance benchmarks run on pull request*\n';

            // Post comment
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
