name: Quality Gates

on:
  pull_request:
    branches:
      - main
      - quarkus-migration
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  MAVEN_CLI_OPTS: '--batch-mode --errors --fail-at-end --show-version'
  # Quality thresholds
  COVERAGE_THRESHOLD: 80
  TEST_SUCCESS_RATE: 95
  MAX_CRITICAL_VIOLATIONS: 0
  PERFORMANCE_REGRESSION_THRESHOLD: 5

jobs:
  code-coverage:
    name: Code Coverage Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests with coverage
        run: |
          mvn ${{ env.MAVEN_CLI_OPTS }} clean test \
            -Dnet.bytebuddy.experimental=true

      - name: Generate coverage report
        run: mvn ${{ env.MAVEN_CLI_OPTS }} jacoco:report

      - name: Check coverage threshold
        run: |
          # Extract coverage percentage from JaCoCo report
          COVERAGE=$(grep -oP 'Total.*?(\d+)%' target/site/jacoco/index.html | grep -oP '\d+' | head -1 || echo 0)

          echo "Code coverage: ${COVERAGE}%"
          echo "Required threshold: ${{ env.COVERAGE_THRESHOLD }}%"

          if [ "$COVERAGE" -lt "${{ env.COVERAGE_THRESHOLD }}" ]; then
            echo "❌ Coverage threshold not met!"
            echo "Current: ${COVERAGE}%, Required: ${{ env.COVERAGE_THRESHOLD }}%"
            exit 1
          else
            echo "✅ Coverage threshold met!"
          fi

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Read coverage report
            const report = fs.readFileSync('target/site/jacoco/index.html', 'utf8');
            const coverageMatch = report.match(/Total.*?(\d+)%/);
            const coverage = coverageMatch ? coverageMatch[1] : 'N/A';

            const threshold = ${{ env.COVERAGE_THRESHOLD }};
            const passed = parseInt(coverage) >= threshold;
            const emoji = passed ? '✅' : '❌';

            const comment = `## ${emoji} Code Coverage Report

            - **Current Coverage**: ${coverage}%
            - **Required Threshold**: ${threshold}%
            - **Status**: ${passed ? 'PASSED' : 'FAILED'}

            ${passed ? '' : '⚠️ Coverage is below the required threshold!'}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  test-quality:
    name: Test Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: |
          mvn ${{ env.MAVEN_CLI_OPTS }} clean test \
            -Dnet.bytebuddy.experimental=true

      - name: Analyze test results
        run: |
          # Count test results
          TOTAL_TESTS=$(grep -oP 'Tests run: \K\d+' target/surefire-reports/*.txt | awk '{s+=$1} END {print s}' || echo 0)
          FAILED_TESTS=$(grep -oP 'Failures: \K\d+' target/surefire-reports/*.txt | awk '{s+=$1} END {print s}' || echo 0)
          ERROR_TESTS=$(grep -oP 'Errors: \K\d+' target/surefire-reports/*.txt | awk '{s+=$1} END {print s}' || echo 0)

          PASSED_TESTS=$((TOTAL_TESTS - FAILED_TESTS - ERROR_TESTS))
          SUCCESS_RATE=$((PASSED_TESTS * 100 / TOTAL_TESTS))

          echo "Total tests: $TOTAL_TESTS"
          echo "Passed: $PASSED_TESTS"
          echo "Failed: $FAILED_TESTS"
          echo "Errors: $ERROR_TESTS"
          echo "Success rate: ${SUCCESS_RATE}%"

          if [ "$SUCCESS_RATE" -lt "${{ env.TEST_SUCCESS_RATE }}" ]; then
            echo "❌ Test success rate below threshold!"
            exit 1
          fi

          echo "✅ Test quality gate passed!"

  build-quality:
    name: Build Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build application
        run: |
          mvn ${{ env.MAVEN_CLI_OPTS }} clean compile

      - name: Check for build warnings
        run: |
          # Check for compilation warnings
          if grep -q "WARNING" build.log 2>/dev/null; then
            echo "⚠️ Build warnings detected"
          else
            echo "✅ No build warnings"
          fi

  security-quality:
    name: Security Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run dependency check
        run: |
          mvn ${{ env.MAVEN_CLI_OPTS }} \
            org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=9 || true

      - name: Check for critical vulnerabilities
        run: |
          if [ -f "target/dependency-check-report.html" ]; then
            CRITICAL_COUNT=$(grep -o "Critical" target/dependency-check-report.html | wc -l || echo 0)
            HIGH_COUNT=$(grep -o "High" target/dependency-check-report.html | wc -l || echo 0)

            echo "Critical vulnerabilities: $CRITICAL_COUNT"
            echo "High vulnerabilities: $HIGH_COUNT"

            if [ "$CRITICAL_COUNT" -gt "${{ env.MAX_CRITICAL_VIOLATIONS }}" ]; then
              echo "❌ Critical vulnerabilities found!"
              exit 1
            fi

            echo "✅ No critical vulnerabilities"
          fi

  performance-quality:
    name: Performance Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build application
        run: mvn ${{ env.MAVEN_CLI_OPTS }} clean package -DskipTests

      - name: Check startup time
        run: |
          # Measure startup time
          START=$(date +%s%N)
          timeout 30s java -jar target/coolstore-quarkus.jar &
          APP_PID=$!

          for i in {1..30}; do
            if curl -f http://localhost:8080/q/health/ready 2>/dev/null; then
              END=$(date +%s%N)
              STARTUP_TIME=$(echo "scale=3; ($END - $START) / 1000000000" | bc)
              echo "Startup time: ${STARTUP_TIME}s"
              break
            fi
            sleep 1
          done

          kill $APP_PID 2>/dev/null || true

          # Compare with baseline (example: 5 seconds)
          BASELINE=5.0
          if (( $(echo "$STARTUP_TIME > $BASELINE * 1.05" | bc -l) )); then
            echo "⚠️ Startup time regression detected"
            echo "Current: ${STARTUP_TIME}s, Baseline: ${BASELINE}s"
          else
            echo "✅ Performance within acceptable range"
          fi

  quality-summary:
    name: Quality Gates Summary
    runs-on: ubuntu-latest
    needs: [code-coverage, test-quality, build-quality, security-quality, performance-quality]
    if: always()

    steps:
      - name: Generate quality summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Quality Gates Summary

          ## Gate Results

          | Gate | Status |
          |------|--------|
          | Code Coverage | ${{ needs.code-coverage.result == 'success' && '✅ PASSED' || '❌ FAILED' }} |
          | Test Quality | ${{ needs.test-quality.result == 'success' && '✅ PASSED' || '❌ FAILED' }} |
          | Build Quality | ${{ needs.build-quality.result == 'success' && '✅ PASSED' || '❌ FAILED' }} |
          | Security Quality | ${{ needs.security-quality.result == 'success' && '✅ PASSED' || '❌ FAILED' }} |
          | Performance Quality | ${{ needs.performance-quality.result == 'success' && '✅ PASSED' || '❌ FAILED' }} |

          ## Thresholds

          - **Code Coverage**: ≥ ${{ env.COVERAGE_THRESHOLD }}%
          - **Test Success Rate**: ≥ ${{ env.TEST_SUCCESS_RATE }}%
          - **Critical Vulnerabilities**: ≤ ${{ env.MAX_CRITICAL_VIOLATIONS }}
          - **Performance Regression**: ≤ ${{ env.PERFORMANCE_REGRESSION_THRESHOLD }}%

          ## Overall Status

          ${{ needs.code-coverage.result == 'success' && needs.test-quality.result == 'success' && needs.build-quality.result == 'success' && needs.security-quality.result == 'success' && needs.performance-quality.result == 'success' && '✅ All quality gates PASSED' || '❌ Some quality gates FAILED' }}

          EOF

      - name: Check overall status
        run: |
          if [[ "${{ needs.code-coverage.result }}" != "success" ]] || \
             [[ "${{ needs.test-quality.result }}" != "success" ]] || \
             [[ "${{ needs.build-quality.result }}" != "success" ]] || \
             [[ "${{ needs.security-quality.result }}" != "success" ]]; then
            echo "❌ Quality gates failed!"
            exit 1
          fi

          echo "✅ All quality gates passed!"
