name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true

env:
  JAVA_VERSION: '17'
  MAVEN_CLI_OPTS: '--batch-mode --errors --fail-at-end --show-version'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/coolstore-quarkus

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.get-version.outputs.version }}
      release-notes: ${{ steps.changelog.outputs.changelog }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get-version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Save changelog to file
          echo "$CHANGELOG" > CHANGELOG.txt
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.txt

  build-artifacts:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: prepare-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Update version in pom.xml
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          VERSION_NO_V="${VERSION#v}"
          mvn versions:set -DnewVersion=${VERSION_NO_V}

      - name: Build JVM artifacts
        run: |
          mvn ${{ env.MAVEN_CLI_OPTS }} clean package -DskipTests
          cp target/coolstore-quarkus.jar coolstore-quarkus-${{ needs.prepare-release.outputs.version }}.jar

      - name: Build native executable
        run: |
          mvn ${{ env.MAVEN_CLI_OPTS }} package -Pnative -DskipTests \
            -Dquarkus.native.container-build=true || echo "Native build skipped or failed"

      - name: Generate checksums
        run: |
          sha256sum coolstore-quarkus-${{ needs.prepare-release.outputs.version }}.jar > checksums.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            coolstore-quarkus-${{ needs.prepare-release.outputs.version }}.jar
            checksums.txt

  build-container-images:
    name: Build and Push Container Images
    runs-on: ubuntu-latest
    needs: prepare-release
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build application
        run: mvn ${{ env.MAVEN_CLI_OPTS }} clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare-release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare-release.outputs.version }}
            type=raw,value=latest

      - name: Build and push JVM container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare-release, build-artifacts, build-container-images]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare-release.outputs.version }}
          name: Release ${{ needs.prepare-release.outputs.version }}
          body_path: CHANGELOG.txt
          draft: false
          prerelease: false
          files: |
            coolstore-quarkus-${{ needs.prepare-release.outputs.version }}.jar
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [prepare-release, create-github-release]
    environment:
      name: production
      url: https://coolstore.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure Kubernetes context
        run: |
          echo "Configuring kubectl for production cluster..."
          # Configure production cluster credentials
          # kubectl config use-context production-cluster

      - name: Deploy to production
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare-release.outputs.version }}"
          echo "Deploying to production: $IMAGE_TAG"

          # Update production deployment
          # kubectl set image deployment/coolstore-quarkus coolstore-quarkus=$IMAGE_TAG -n production
          # kubectl rollout status deployment/coolstore-quarkus -n production --timeout=600s

          echo "Production deployment initiated"

      - name: Run production smoke tests
        run: |
          PROD_URL="${{ vars.PRODUCTION_URL || 'https://coolstore.example.com' }}"

          # Wait for application to be ready
          for i in {1..30}; do
            if curl -f "$PROD_URL/q/health/ready" 2>/dev/null; then
              echo "Application is ready!"
              break
            fi
            echo "Waiting for application... ($i/30)"
            sleep 10
          done

          # Basic smoke tests
          curl -f "$PROD_URL/api/products" || exit 1
          curl -f "$PROD_URL/q/health/live" || exit 1

          echo "Production smoke tests passed!"

  notify-release:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [prepare-release, deploy-production]
    if: always()

    steps:
      - name: Send release notification
        if: vars.SLACK_WEBHOOK_URL
        run: |
          STATUS="${{ needs.deploy-production.result }}"
          COLOR="good"
          if [ "$STATUS" != "success" ]; then
            COLOR="danger"
          fi

          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d "{
              \"attachments\": [{
                \"color\": \"$COLOR\",
                \"title\": \"Production Release: ${{ needs.prepare-release.outputs.version }}\",
                \"text\": \"Status: $STATUS\nRelease notes: https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare-release.outputs.version }}\",
                \"footer\": \"GitHub Actions\",
                \"ts\": $(date +%s)
              }]
            }"

      - name: Create release summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Release Summary

          ## Version
          ${{ needs.prepare-release.outputs.version }}

          ## Status
          - Build Artifacts: ${{ needs.build-artifacts.result }}
          - Container Images: ${{ needs.build-container-images.result }}
          - GitHub Release: ${{ needs.create-github-release.result }}
          - Production Deployment: ${{ needs.deploy-production.result }}

          ## Release Notes
          ${{ needs.prepare-release.outputs.release-notes }}

          ## Links
          - [Release Page](https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare-release.outputs.version }})
          - [Container Images](${{ env.REGISTRY }}/${{ env.IMAGE_NAME }})

          EOF
