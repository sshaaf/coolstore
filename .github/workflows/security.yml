name: Security Scanning

on:
  pull_request:
    branches:
      - main
      - quarkus-migration
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  MAVEN_CLI_OPTS: '--batch-mode --errors --fail-at-end --show-version'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run OWASP Dependency Check
        run: |
          mvn ${{ env.MAVEN_CLI_OPTS }} \
            org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFiles=.github/dependency-check-suppressions.xml || true

      - name: Upload dependency check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 30

      - name: Check for critical vulnerabilities
        run: |
          if [ -f "target/dependency-check-report.html" ]; then
            # Check if critical vulnerabilities exist
            if grep -q "Critical" target/dependency-check-report.html; then
              echo "CRITICAL vulnerabilities found!"
              echo "Please review the dependency-check-report.html"
              exit 1
            fi
          fi

  sast-scan:
    name: Static Application Security Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build application
        run: mvn ${{ env.MAVEN_CLI_OPTS }} clean compile

      - name: Run SpotBugs
        run: |
          mvn ${{ env.MAVEN_CLI_OPTS }} \
            com.github.spotbugs:spotbugs-maven-plugin:4.8.3.0:check \
            -Dspotbugs.effort=Max \
            -Dspotbugs.threshold=Low || true

      - name: Upload SpotBugs report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          retention-days: 30

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build application
        run: mvn ${{ env.MAVEN_CLI_OPTS }} clean package -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR
        run: mvn ${{ env.MAVEN_CLI_OPTS }} clean package -DskipTests

      - name: Build Docker image
        run: |
          docker build -f src/main/docker/Dockerfile.jvm -t coolstore-quarkus:latest .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'coolstore-quarkus:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [dependency-scan, sast-scan, codeql-analysis, secret-scan]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: security-reports

      - name: Generate summary report
        run: |
          mkdir -p security-summary
          cat > security-summary/SECURITY-REPORT.md << 'EOF'
          # Security Scan Report

          ## Scan Date
          $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          ## Scans Completed

          - Dependency Vulnerability Scan: ${{ needs.dependency-scan.result }}
          - Static Application Security Testing: ${{ needs.sast-scan.result }}
          - CodeQL Analysis: ${{ needs.codeql-analysis.result }}
          - Secret Scanning: ${{ needs.secret-scan.result }}

          ## Results

          Please review individual scan reports for detailed findings.

          ### Recommendations

          1. Review all HIGH and CRITICAL vulnerabilities
          2. Update dependencies with known vulnerabilities
          3. Address any security hotspots identified by SAST
          4. Ensure no secrets are committed to the repository

          ---
          *Generated by GitHub Actions Security Pipeline*
          EOF

      - name: Upload security summary
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: security-summary/SECURITY-REPORT.md
          retention-days: 90
