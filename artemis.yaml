# AMQP 1.0 broker (Red Hat AMQ Broker / Artemis) - DEV/TEST convenience only.
#
# Production: use AMQ Broker Operator, or a managed AMQP 1.0 service.
#
# Topology requirement: the application has TWO consumers of the *same* address
# (`orders`): OrderEventConsumer persists orders, InventoryNotificationConsumer
# warns on low stock. The address must therefore use MULTICAST (topic)
# semantics. `AMQ_ADDRESSES` without `AMQ_QUEUES` creates the address with the
# Artemis default routing type MULTICAST; each SmallRye AMQP channel attaches
# its own queue, so both consumers receive every event. Do NOT add
# `AMQ_QUEUES=orders` - that would create a single anycast queue and one
# consumer would silently swallow the other's events.
apiVersion: v1
kind: Service
metadata:
  name: artemis
  labels:
    app.kubernetes.io/name: artemis
    app.kubernetes.io/part-of: coolstore
spec:
  selector:
    app.kubernetes.io/name: artemis
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: artemis
  labels:
    app.kubernetes.io/name: artemis
    app.kubernetes.io/part-of: coolstore
spec:
  serviceName: artemis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: artemis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: artemis
        app.kubernetes.io/part-of: coolstore
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: artemis
          # Requires the Red Hat registry pull secret on the cluster; pin the
          # AMQ Broker minor version that is supported by your subscription.
          image: registry.redhat.io/amq7/amq-broker-rhel8:7.11
          imagePullPolicy: IfNotPresent
          ports:
            - name: amqp
              containerPort: 5672
              protocol: TCP
          env:
            - name: AMQ_NAME
              value: artemis
            - name: AMQ_USER
              value: coolstore
            - name: AMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coolstore-broker
                  key: AMQP_PASSWORD
            - name: AMQ_ROLE
              value: admin
            - name: AMQ_REQUIRE_LOGIN
              value: "true"
            - name: AMQ_TRANSPORTS
              value: amqp
            - name: AMQ_ADDRESSES
              value: orders
            - name: AMQ_DATA_DIR
              value: /opt/amq/data
            - name: AMQ_GLOBAL_MAX_SIZE
              value: 100mb
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            tcpSocket:
              port: amqp
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: amqp
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /opt/amq/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: artemis
          app.kubernetes.io/part-of: coolstore
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
