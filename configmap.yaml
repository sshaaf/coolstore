# CoolStore application configuration (non-sensitive values only).
# Secrets live in the coolstore-db / coolstore-broker Secrets - never here.
#
# Every key below maps to a MicroProfile Config placeholder in
# src/main/resources/application.properties, so the image stays environment
# agnostic and the same image promotes dev -> test -> prod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coolstore-config
  labels:
    app.kubernetes.io/name: coolstore
    app.kubernetes.io/part-of: coolstore
data:
  # --- Datasource (password comes from the coolstore-db Secret) ------------
  # Env-var form of the quarkus.datasource.* properties. SmallRye Config gives
  # environment variables a higher ordinal than application.properties, so
  # these win over the ${DB_URL:} / ${DB_USER:} placeholders in the image.
  # Same-namespace Service DNS name of the PostgreSQL Service below. For a
  # managed database, replace with the provider's JDBC URL and open egress.
  QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/coolstore
  QUARKUS_DATASOURCE_USERNAME: coolstore

  # --- Messaging (AMQP 1.0) ------------------------------------------------
  # The address `orders` must use MULTICAST (topic) semantics: two consumers
  # read it (OrderEventConsumer, InventoryNotificationConsumer). The password
  # comes from the coolstore-broker Secret. See CONTAINERIZATION_REPORT.md.
  AMQP_HOST: artemis
  AMQP_PORT: "5672"
  AMQP_USER: coolstore

  # --- Audit streaming (audit-logging-library 2.0.0, async TCP) ------------
  # Non-fatal by design: a failed emit is logged, it never breaks a checkout.
  # Point AUDIT_STREAM_HOST at your collector, or set AUDIT_ENABLED: "false".
  AUDIT_ENABLED: "true"
  AUDIT_STREAM_HOST: audit-collector
  AUDIT_STREAM_PORT: "6514"
  AUDIT_STREAM_PROTOCOL: TCP

  # --- Cart ----------------------------------------------------------------
  CART_TTL_SECONDS: "1800"

  # --- Storefront ----------------------------------------------------------
  # /coolstore.json and /keycloak.json are rendered from these values at
  # request time, so the SPA points at the right endpoints without a rebuild.
  # The SPA reads these from /coolstore.json. They must resolve to a non-empty
  # value: SmallRye Config fails to convert "" for the String properties
  # coolstore.api-endpoint / coolstore.secure-api-endpoint and Quarkus then
  # aborts startup. Point them at this deployment's route.
  API_ENDPOINT: https://coolstore-coolstore-migiq.apps.ocp.g5pzs.sandbox1052.opentlc.com/services
  SECURE_API_ENDPOINT: https://coolstore-coolstore-migiq.apps.ocp.g5pzs.sandbox1052.opentlc.com/services
  COOLSTORE_MONOLITH: "true"
  SSO_ENABLED: "false"
  KEYCLOAK_REALM: eap
  KEYCLOAK_AUTH_SERVER_URL: https://keycloak.apps.example.com/
  KEYCLOAK_RESOURCE: eap-app

  # --- Runtime -------------------------------------------------------------
  # JVM tuning (heap sizing, host binding) is baked into the image as
  # JAVA_OPTIONS / JAVA_OPTS_APPEND; raise -XX:MaxRAMPercentage here only if the
  # memory limit below changes.
  QUARKUS_LOG_LEVEL: INFO
