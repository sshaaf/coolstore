apiVersion: apps/v1
kind: Deployment
metadata:
  name: coolstore
  labels:
    app: coolstore
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: coolstore
  template:
    metadata:
      labels:
        app: coolstore
    spec:
      serviceAccountName: coolstore
      # Long enough for an in-flight checkout + the orders consumer to finish.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 185
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coolstore
          image: coolstore:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: coolstore-config
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef: { name: coolstore-db, key: url }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: coolstore-db, key: password }
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef: { name: coolstore-broker, key: bootstrap-servers }
            - name: OIDC_AUTH_SERVER_URL
              valueFrom:
                configMapKeyRef: { name: coolstore-config, key: OIDC_AUTH_SERVER_URL, optional: true }
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet: { path: /q/health/started, port: 8080 }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /q/health/ready, port: 8080 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /q/health/live, port: 8080 }
            periodSeconds: 15
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
