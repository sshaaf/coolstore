apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coolstore
spec:
  podSelector:
    matchLabels:
      app: coolstore
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # PostgreSQL, Kafka, Keycloak and the audit collector are all reached over TCP.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 9000
