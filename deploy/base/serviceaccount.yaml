# ---------------------------------------------------------------------------------------------
# MIRROR of /serviceaccount.yaml (repository root) - the root copy is canonical.
# Kustomize (deploy/base) cannot load files above its own directory, so the base carries a
# copy. Change the root file and copy it here in the same commit.
# ---------------------------------------------------------------------------------------------
# ---------------------------------------------------------------------------------------------
# Dedicated service account. The application never talks to the Kubernetes API, so the token is
# not mounted (see also automountServiceAccountToken in deployment.yaml).
# ---------------------------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coolstore
  labels:
    app: coolstore
    app.kubernetes.io/name: coolstore
    app.kubernetes.io/part-of: coolstore
automountServiceAccountToken: false
