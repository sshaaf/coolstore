apiVersion: apps/v1
kind: Deployment
metadata:
  name: coolstore
  annotations:
    # Quarkus fast-jar boots in ~2s; give slow nodes room for the startup probe.
    alpha.image.policy.openshift.io/resolve-names: "*"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: coolstore
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coolstore
        app.kubernetes.io/part-of: coolstore
    spec:
      serviceAccountName: coolstore
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coolstore
          image: image-registry.openshift-image-registry.svc:5000/coolstore/coolstore:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: coolstore-config
          env:
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coolstore-db
                  key: QUARKUS_DATASOURCE_PASSWORD
            - name: AMQP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coolstore-broker
                  key: AMQP_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /q/health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # Writable scratch space only; the app itself needs no writable path.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
