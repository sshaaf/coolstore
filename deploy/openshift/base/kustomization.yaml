apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: coolstore
resources:
  - serviceaccount.yaml
  - configmap.yaml
  - secret.example.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
images:
  - name: coolstore
    newName: image-registry.openshift-image-registry.svc:5000/coolstore/coolstore
    newTag: latest
