apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coolstore
spec:
  podSelector:
    matchLabels:
      app: coolstore
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # OpenShift router only
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to: [{podSelector: {matchLabels: {app: postgresql}}}]
      ports: [{protocol: TCP, port: 5432}]
    - to: [{podSelector: {matchLabels: {app: redis}}}]
      ports: [{protocol: TCP, port: 6379}]
    - to: [{podSelector: {matchLabels: {app: amq-broker}}}]
      ports: [{protocol: TCP, port: 61616}]
    - to: [{podSelector: {matchLabels: {app: audit-collector}}}]
      ports: [{protocol: TCP, port: 5044}]
    - to: [{podSelector: {matchLabels: {app: keycloak}}}]
      ports: [{protocol: TCP, port: 8443}]
    # DNS
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: openshift-dns}}}]
      ports: [{protocol: UDP, port: 5353}, {protocol: TCP, port: 5353}]
