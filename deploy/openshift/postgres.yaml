apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: coolstore-db-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coolstore-db
  labels:
    app: coolstore-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coolstore-db
  template:
    metadata:
      labels:
        app: coolstore-db
    spec:
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-15:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: coolstore-db-secret
                  key: DB_USER
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coolstore-db-secret
                  key: DB_PASSWORD
            - name: POSTGRESQL_DATABASE
              value: postgresDB
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["/usr/bin/pg_isready", "-U", "postgresUser", "-d", "postgresDB"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: coolstore-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: coolstore-db
spec:
  selector:
    app: coolstore-db
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
