apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: coolstore-monolith
  labels:
    app: coolstore-monolith
spec:
  to:
    kind: Service
    name: coolstore-monolith
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
