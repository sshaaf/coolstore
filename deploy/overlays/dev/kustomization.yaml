apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Development overlay: its own namespace, one replica, the "dev" image tag.
# Secrets are per namespace and are created out of band with the same names as production
# (coolstore-db, coolstore-broker) - isolation comes from the namespace, not from a name suffix.
namespace: coolstore-dev
resources:
  - ../../base
images:
  - name: coolstore
    newName: image-registry.openshift-image-registry.svc:5000/coolstore-dev/coolstore
    newTag: dev
replicas:
  - name: coolstore
    count: 1
patches:
  - target: { kind: Deployment, name: coolstore }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 384Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 768Mi
