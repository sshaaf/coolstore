apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: coolstore-dev
resources:
  - ../../base
images:
  - name: coolstore
    newName: image-registry.openshift-image-registry.svc:5000/coolstore-dev/coolstore
    newTag: dev
replicas:
  - name: coolstore
    count: 1
patches:
  - target: { kind: Deployment, name: coolstore }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/valueFrom/secretKeyRef/name
        value: coolstore-db-dev
