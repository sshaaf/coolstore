apiVersion: apps/v1
kind: Deployment
metadata:
  name: coolstore
  labels:
    app.kubernetes.io/name: coolstore
    app.kubernetes.io/part-of: coolstore
    app.kubernetes.io/version: "1.0.0"
  annotations:
    # Resolve ImageStreamTag references (coolstore:latest) on pod creation.
    alpha.image.policy.openshift.io/resolve-names: "*"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: coolstore
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coolstore
        app.kubernetes.io/part-of: coolstore
    spec:
      serviceAccountName: coolstore
      automountServiceAccountToken: false
      # Openshift restricted-v2 SCC compatible pod-level hardening.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coolstore
          # ImageStreamTag in this namespace (lookupPolicy.local on the
          # ImageStream), so no registry path or namespace is hard-coded.
          image: coolstore:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: coolstore-config
          env:
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coolstore-db
                  key: QUARKUS_DATASOURCE_PASSWORD
            - name: AMQP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coolstore-broker
                  key: AMQP_PASSWORD
          resources:
            # Quarkus fast-jar needs ~200Mi at steady state; -XX:MaxRAMPercentage=75
            # therefore sizes the heap to ~384Mi of the 512Mi limit.
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Startup probe covers Flyway migration + Hibernate bootstrap.
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            # Dependency-free: a dead database must not restart the pod.
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            # Includes the DatabaseHealthCheck (datasource reachable, isValid(2)).
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # Only writable path the JVM/Quarkus needs. The application itself
            # writes no files (audit events are streamed over TCP).
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
