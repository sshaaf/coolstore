apiVersion: apps/v1
kind: Deployment
metadata:
  name: coolstore
  labels:
    app: coolstore
    app.kubernetes.io/name: coolstore
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: coolstore
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: coolstore
  template:
    metadata:
      labels:
        app: coolstore
        app.kubernetes.io/name: coolstore
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /q/metrics
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: coolstore
      # OpenShift restricted-v2 assigns an arbitrary UID from the namespace
      # range; the image is built group-0 writable (USER 185, group root), so no
      # runAsUser is pinned here.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coolstore
          # kustomization.yaml rewrites this to the OpenShift internal registry.
          image: coolstore:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: coolstore-config
            - secretRef:
                name: coolstore-secrets
          env:
            # Optional Redis AUTH; empty secret value leaves Redis unauthenticated.
            - name: QUARKUS_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coolstore-secrets
                  key: REDIS_PASSWORD
                  optional: true
          # Flyway + JVM boot may take a while; startupProbe gates the others.
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Includes PostgreSQL, Redis and Artemis checks (see docs/runbook.md).
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config-files
              mountPath: /deployments/config
              readOnly: true
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 40
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: config-files
          configMap:
            name: coolstore-config
            items:
              - key: coolstore.json
                path: coolstore.json
              - key: keycloak.json
                path: keycloak.json
