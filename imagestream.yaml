# ImageStream that receives the output of the BuildConfig below.
# lookupPolicy.local lets the Deployment reference the image as
# `coolstore:latest` instead of a hard-coded registry path, so the manifests
# work in any namespace.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: coolstore
  labels:
    app.kubernetes.io/name: coolstore
    app.kubernetes.io/part-of: coolstore
spec:
  lookupPolicy:
    local: true
