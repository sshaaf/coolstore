# ---------------------------------------------------------------------------------------------
# One-command deployment:
#
#   oc apply -k .              # namespace/project must already exist
#   oc apply -f secret.yaml    # once, after replacing the placeholders (or oc create secret ...)
#
# secret.yaml is deliberately NOT part of this kustomization: re-applying a placeholder Secret
# would overwrite real credentials. Create the Secrets out of band (SealedSecrets, Vault, ...).
# ---------------------------------------------------------------------------------------------
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - networkpolicy.yaml
  - hpa.yaml
