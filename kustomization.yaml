apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Apply with:  oc apply -k .
# (Do not use `oc apply -f .` - the root also contains pom.xml, realm-export.json, etc.)
namespace: coolstore

# secret.yaml is intentionally NOT listed: create the Secret out-of-band
# (oc create secret generic coolstore-secrets ...) so that a placeholder never
# overwrites real credentials on a subsequent apply.
resources:
  - serviceaccount.yaml
  - configmap.yaml
  - postgresql.yaml
  - redis.yaml
  - artemis.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml

images:
  - name: coolstore
    newName: image-registry.openshift-image-registry.svc:5000/coolstore/coolstore
    newTag: latest
