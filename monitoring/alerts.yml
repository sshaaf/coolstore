groups:
  - name: coolstore-alerts
    interval: 30s
    rules:
      # Application availability alerts
      - alert: CoolstoreDown
        expr: up{job="coolstore-quarkus"} == 0
        for: 1m
        labels:
          severity: critical
          component: coolstore-quarkus
        annotations:
          summary: "Coolstore application is down"
          description: "Coolstore Quarkus application has been down for more than 1 minute."

      # High error rate alert
      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          component: coolstore-quarkus
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors per second over the last 5 minutes."

      # High response time alert
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          component: coolstore-quarkus
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }}s over the last 5 minutes."

      # High memory usage alert
      - alert: HighMemoryUsage
        expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 5m
        labels:
          severity: warning
          component: coolstore-quarkus
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is at {{ $value | humanizePercentage }} over the last 5 minutes."

      # High CPU usage alert
      - alert: HighCPUUsage
        expr: process_cpu_usage > 0.9
        for: 5m
        labels:
          severity: warning
          component: coolstore-quarkus
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is at {{ $value | humanizePercentage }} over the last 5 minutes."

      # Database connection pool exhaustion
      - alert: DatabaseConnectionPoolExhausted
        expr: (hikaricp_connections_active / hikaricp_connections_max) > 0.9
        for: 2m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Database connection pool near exhaustion"
          description: "Database connection pool usage is at {{ $value | humanizePercentage }}."

      # GC pressure alert
      - alert: HighGCPressure
        expr: rate(jvm_gc_pause_seconds_sum[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
          component: jvm
        annotations:
          summary: "High GC pressure detected"
          description: "JVM is spending {{ $value | humanizePercentage }} of time in GC over the last 5 minutes."
