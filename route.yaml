apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: coolstore
  labels:
    app.kubernetes.io/name: coolstore
    app.kubernetes.io/part-of: coolstore
  annotations:
    # Checkout publishes to AMQP synchronously; keep the router timeout short.
    haproxy.router.openshift.io/timeout: 30s
spec:
  to:
    kind: Service
    name: coolstore
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
