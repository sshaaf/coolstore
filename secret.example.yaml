# TEMPLATE ONLY - never commit real secret values.
#
# Create the Secrets out of band, before applying the rest of the manifests
# (same key names as the migrate-stage deploy/ overlay):
#
#   oc -n coolstore create secret generic coolstore-db \
#     --from-literal=QUARKUS_DATASOURCE_PASSWORD='<postgres-password>'
#
#   oc -n coolstore create secret generic coolstore-broker \
#     --from-literal=AMQP_PASSWORD='<artemis-password>'
#
#   # only when SSO_ENABLED=true and the client is confidential
#   oc -n coolstore create secret generic coolstore-oidc \
#     --from-literal=KEYCLOAK_CLIENT_SECRET='<client-secret>'
#
# This file is intentionally NOT part of kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: coolstore-db
  labels:
    app.kubernetes.io/name: coolstore
    app.kubernetes.io/part-of: coolstore
type: Opaque
stringData:
  # Consumed by the application (env QUARKUS_DATASOURCE_PASSWORD) and by the
  # PostgreSQL StatefulSet (POSTGRESQL_PASSWORD) - a single source of truth.
  QUARKUS_DATASOURCE_PASSWORD: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: coolstore-broker
  labels:
    app.kubernetes.io/name: coolstore
    app.kubernetes.io/part-of: coolstore
type: Opaque
stringData:
  AMQP_PASSWORD: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: coolstore-oidc
  labels:
    app.kubernetes.io/name: coolstore
    app.kubernetes.io/part-of: coolstore
type: Opaque
stringData:
  KEYCLOAK_CLIENT_SECRET: "CHANGE_ME"
