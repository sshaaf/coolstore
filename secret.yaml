# =============================================================================
# TEMPLATE ONLY - DO NOT COMMIT REAL CREDENTIALS.
#
# Replace every value below before applying, or (preferred) create the Secret
# out-of-band and keep it out of Git:
#
#   oc create secret generic coolstore-secrets \
#     --from-literal=DB_USERNAME=coolstore \
#     --from-literal=DB_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=ARTEMIS_USER=amq \
#     --from-literal=ARTEMIS_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=REDIS_PASSWORD=""
#
# In production use an external secret manager (Vault / External Secrets
# Operator / Sealed Secrets) instead of this file.
#
# This file is deliberately excluded from kustomization.yaml so that a
# placeholder apply can never overwrite credentials that already exist.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: coolstore-secrets
  labels:
    app: coolstore
    app.kubernetes.io/part-of: coolstore
type: Opaque
stringData:
  DB_USERNAME: coolstore
  DB_PASSWORD: change-me
  ARTEMIS_USER: amq
  ARTEMIS_PASSWORD: change-me
  # Empty = Redis without AUTH. Set a value to enable requirepass; the
  # Deployment forwards it as QUARKUS_REDIS_PASSWORD.
  REDIS_PASSWORD: ""
