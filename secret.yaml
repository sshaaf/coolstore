# ---------------------------------------------------------------------------------------------
# CoolStore monolith - Secret placeholders.
#
# THESE ARE NOT CREDENTIALS. Every value is a placeholder. Replace them out of band before the
# first deployment and never commit a real value:
#
#   oc create secret generic coolstore-db \
#     --from-literal=url=jdbc:postgresql://postgres:5432/postgresDB \
#     --from-literal=username=postgresUser \
#     --from-literal=password="$(openssl rand -hex 16)" -n <namespace>
#
# For GitOps, use SealedSecrets / External Secrets / Vault instead of this file.
# ---------------------------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: coolstore-db
  labels:
    app: coolstore
    app.kubernetes.io/name: coolstore
    app.kubernetes.io/part-of: coolstore
type: Opaque
stringData:
  # Point at the in-cluster PostgreSQL service, or at a managed database outside the cluster.
  url: "jdbc:postgresql://postgres:5432/postgresDB"
  username: "postgresUser"
  password: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: coolstore-broker
  labels:
    app: coolstore
    app.kubernetes.io/name: coolstore
    app.kubernetes.io/part-of: coolstore
type: Opaque
stringData:
  # AMQ Streams / Kafka bootstrap (listener 9092), e.g. coolstore-kafka-bootstrap:9092
  bootstrap-servers: "kafka-bootstrap:9092"
---
# Optional: only needed when the backend validates bearer tokens against a *confidential* OIDC
# client. The SPA client (eap-app) is public, so this Secret can stay unapplied.
apiVersion: v1
kind: Secret
metadata:
  name: coolstore-oidc
  labels:
    app: coolstore
    app.kubernetes.io/name: coolstore
    app.kubernetes.io/part-of: coolstore
type: Opaque
stringData:
  client-secret: "CHANGE_ME"
