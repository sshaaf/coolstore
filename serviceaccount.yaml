# ---------------------------------------------------------------------------------------------
# Dedicated service account. The application never talks to the Kubernetes API, so the token is
# not mounted (see also automountServiceAccountToken in deployment.yaml).
# ---------------------------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coolstore
  labels:
    app: coolstore
    app.kubernetes.io/name: coolstore
    app.kubernetes.io/part-of: coolstore
automountServiceAccountToken: false
