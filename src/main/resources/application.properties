# ---------------------------------------------------------------------------
# CoolStore - Quarkus 3 / Java 21 runtime configuration
# Every value that differs between environments is externalised (env var or
# OpenShift ConfigMap/Secret); the defaults below are for local development.
# ---------------------------------------------------------------------------

quarkus.application.name=coolstore
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# The legacy WAR used @ApplicationPath("/services"); keep the prefix so the
# AngularJS SPA and any external client keep working unchanged.
quarkus.rest.path=/services
quarkus.rest.jackson.optimization.enable-reflection-free-serializers=true

# --- Datasource -------------------------------------------------------------
# Leave DB_URL empty in dev/test so Quarkus Dev Services can start PostgreSQL.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:coolstore}
quarkus.datasource.password=${DB_PASSWORD:coolstore}
quarkus.datasource.jdbc.url=${DB_URL:}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=16

# --- Flyway (replaces the @Singleton @Startup Flyway 4.1.2 bootstrapper) ----
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=db/migration
quarkus.flyway.baseline-version=0

# --- Hibernate ORM 6 --------------------------------------------------------
# Flyway owns the schema; Hibernate must never generate DDL.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.jdbc.statement-batch-size=16

# --- Messaging (SmallRye Reactive Messaging over AMQP 1.0 / Artemis) --------
# Two independent consumers of the same address reproduce the JMS topic fan-out
# (OrderEventConsumer persists orders, InventoryNotificationConsumer warns on
# low stock).
# SmallRye forbids the same channel name for incoming and outgoing, so the
# producer uses its own channel (orders-out) that targets the same AMQP address.
mp.messaging.outgoing.orders-out.connector=smallrye-amqp
mp.messaging.outgoing.orders-out.address=orders
mp.messaging.outgoing.orders-out.durable=true

mp.messaging.incoming.orders.connector=smallrye-amqp
mp.messaging.incoming.orders.address=orders
mp.messaging.incoming.orders.durable=true

mp.messaging.incoming.orders-inventory.connector=smallrye-amqp
mp.messaging.incoming.orders-inventory.address=orders
mp.messaging.incoming.orders-inventory.durable=true

mp.messaging.connector.smallrye-amqp.host=${AMQP_HOST:localhost}
mp.messaging.connector.smallrye-amqp.port=${AMQP_PORT:5672}
mp.messaging.connector.smallrye-amqp.username=${AMQP_USER:admin}
mp.messaging.connector.smallrye-amqp.password=${AMQP_PASSWORD:admin}
mp.messaging.connector.smallrye-amqp.reconnect-attempts=10

# --- Audit logging (library 2.0.0, TCP streaming) ---------------------------
audit.enabled=${AUDIT_ENABLED:true}
audit.stream.host=${AUDIT_STREAM_HOST:localhost}
audit.stream.port=${AUDIT_STREAM_PORT:6514}
audit.stream.protocol=${AUDIT_STREAM_PROTOCOL:TCP}
audit.stream.buffer.size=${AUDIT_STREAM_BUFFER_SIZE:8192}
audit.stream.reconnect.ms=${AUDIT_STREAM_RECONNECT_MS:5000}

# --- Cart ------------------------------------------------------------------
# Idle carts are evicted after this many seconds (in-memory store).
cart.store.ttl-seconds=${CART_TTL_SECONDS:1800}

# --- Storefront / SSO (served by StorefrontConfigRoutes) -------------------
coolstore.monolith=${COOLSTORE_MONOLITH:true}
coolstore.api-endpoint=${API_ENDPOINT:}
coolstore.secure-api-endpoint=${SECURE_API_ENDPOINT:}
coolstore.sso-enabled=${SSO_ENABLED:true}
keycloak.realm=${KEYCLOAK_REALM:eap}
keycloak.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8081/}
keycloak.resource=${KEYCLOAK_RESOURCE:eap-app}
keycloak.ssl-required=${KEYCLOAK_SSL_REQUIRED:external}
keycloak.public-client=${KEYCLOAK_PUBLIC_CLIENT:true}
keycloak.confidential-port=${KEYCLOAK_CONFIDENTIAL_PORT:0}

# --- Health / metrics ------------------------------------------------------
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-health.ui.enable=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# --- Logging --------------------------------------------------------------
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n
quarkus.log.category."com.redhat.coolstore".level=INFO
quarkus.log.category."com.enterprise.audit".level=WARN
# Keep startup logging visible (replaces the WebLogic StartupListener markers)
quarkus.log.category."io.quarkus".level=INFO

# --- Container image (Jib alternative to the Containerfile) ---------------
quarkus.container-image.build=false
quarkus.container-image.group=${IMAGE_GROUP:coolstore}
quarkus.container-image.name=coolstore
quarkus.container-image.tag=${IMAGE_TAG:latest}

# ---------------------------------------------------------------------------
# Test profile: Dev Services PostgreSQL, in-memory messaging connector,
# audit emission disabled (no collector in CI).
# ---------------------------------------------------------------------------
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:15
%test.quarkus.flyway.migrate-at-start=true
%test.audit.enabled=false
%test.coolstore.sso-enabled=false
%test.mp.messaging.outgoing.orders.connector=smallrye-in-memory
%test.mp.messaging.incoming.orders.connector=smallrye-in-memory
%test.mp.messaging.incoming.orders-inventory.connector=smallrye-in-memory
%test.quarkus.log.category."com.redhat.coolstore".level=INFO

# ---------------------------------------------------------------------------
# Production profile: nothing to default, everything comes from the environment.
# ---------------------------------------------------------------------------
%prod.quarkus.log.console.json=true
