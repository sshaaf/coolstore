# ---------------------------------------------------------------------------------------------
# CoolStore monolith - Quarkus 3 configuration
#
# 12-factor: every environment-specific value is an environment variable with a safe default for
# local development only. The %prod profile has no localhost defaults for anything that must be
# supplied by OpenShift (ConfigMap/Secret).
# ---------------------------------------------------------------------------------------------

quarkus.application.name=coolstore
quarkus.application.version=1.0.0-SNAPSHOT

# HTTP
quarkus.http.port=${QUARKUS_HTTP_PORT:8080}
quarkus.http.root-path=/
quarkus.http.test-port=0
# Give in-flight checkouts and the messaging consumer time to finish on SIGTERM.
quarkus.shutdown.timeout=${QUARKUS_SHUTDOWN_TIMEOUT:30s}

# ---------------------------------------------------------------------------------------------
# Persistence (Hibernate ORM 6 + Agroal). Schema is owned by Flyway, never by Hibernate.
# ---------------------------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgresUser}
quarkus.datasource.password=${DB_PASSWORD:postgresPW}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/postgresDB}
quarkus.datasource.jdbc.min-size=${DB_POOL_MIN_SIZE:2}
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX_SIZE:20}

quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.jdbc.statement-batch-size=16

# ---------------------------------------------------------------------------------------------
# Flyway replaces the EJB @Singleton @Startup DataBaseMigrationStartup bean.
# V1_1__CreateSchema.sql and V1_2__AddInitialData.sql are byte-identical: checksums preserved.
# baseline-on-migrate only matters for databases that predate flyway_schema_history.
# ---------------------------------------------------------------------------------------------
quarkus.flyway.migrate-at-start=${FLYWAY_MIGRATE_AT_START:true}
quarkus.flyway.locations=db/migration
quarkus.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
quarkus.flyway.baseline-version=1
quarkus.flyway.validate-on-migrate=true

# ---------------------------------------------------------------------------------------------
# Messaging: channel `orders` replaces the JMS topic `topic/orders`.
# Production: Kafka (AMQ Streams) with a stable consumer group so replicas share the topic
# (competing consumers, same semantics as the two-node JBoss EAP demo in the README).
# ---------------------------------------------------------------------------------------------
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:}

mp.messaging.outgoing.orders-out.connector=smallrye-kafka
mp.messaging.outgoing.orders-out.topic=${ORDERS_TOPIC:orders}
mp.messaging.outgoing.orders-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.orders-out.acks=all
mp.messaging.outgoing.orders-out.health-enabled=true

mp.messaging.incoming.orders.connector=smallrye-kafka
mp.messaging.incoming.orders.topic=${ORDERS_TOPIC:orders}
mp.messaging.incoming.orders.group.id=${ORDERS_CONSUMER_GROUP:coolstore-order-service}
mp.messaging.incoming.orders.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.orders.auto.offset.reset=earliest
# A poison message must not stop the checkout pipeline; it is logged instead.
mp.messaging.incoming.orders.failure-strategy=ignore
mp.messaging.incoming.orders.health-enabled=true

# Cart state: in-memory, keyed by cartId, bounded. See docs/cart-state.md.
cart.store.max-carts=${CART_STORE_MAX_CARTS:10000}
cart.store.idle-timeout=${CART_STORE_IDLE_TIMEOUT:PT4H}

# Duplicate-delivery guard for the orders consumer (per replica, see docs/services.md).
orders.dedupe.max-entries=${ORDERS_DEDUPE_MAX_ENTRIES:10000}

# ---------------------------------------------------------------------------------------------
# Audit logging (audit-logging-library 2.0.0, StreamableAuditLogger over TCP, NDJSON)
# ---------------------------------------------------------------------------------------------
audit.enabled=${AUDIT_ENABLED:true}
audit.stream.host=${AUDIT_STREAM_HOST:localhost}
audit.stream.port=${AUDIT_STREAM_PORT:9000}
audit.stream.protocol=${AUDIT_STREAM_PROTOCOL:TCP}
audit.stream.buffer-size=${AUDIT_STREAM_BUFFER_SIZE:8192}
audit.stream.reconnect-ms=${AUDIT_STREAM_RECONNECT_MS:5000}

# ---------------------------------------------------------------------------------------------
# OIDC / Keycloak. The SPA has always enforced login; the backend bearer-token protection of
# /services/** is a behaviour change and stays opt-in (OIDC_ENABLED=true).
# ---------------------------------------------------------------------------------------------
quarkus.oidc.tenant-enabled=${OIDC_ENABLED:false}
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:eap-app}
quarkus.oidc.application-type=service

oidc.realm=${OIDC_REALM:eap}
oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:}
oidc.client-id=${OIDC_CLIENT_ID:eap-app}
oidc.ssl-required=${OIDC_SSL_REQUIRED:external}
oidc.public-client=${OIDC_PUBLIC_CLIENT:true}

# SPA bootstrap document (/coolstore.json, generated at runtime)
coolstore.monolith=${COOLSTORE_MONOLITH:true}
coolstore.api-endpoint=${API_ENDPOINT:}
coolstore.secure-api-endpoint=${SECURE_API_ENDPOINT:}
coolstore.sso-enabled=${SSO_ENABLED:true}

# ---------------------------------------------------------------------------------------------
# Observability: SmallRye Health (/q/health, replaces health.jsp) and Micrometer/Prometheus
# ---------------------------------------------------------------------------------------------
quarkus.smallrye-health.root-path=/q/health
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.log.console.json=${LOG_JSON:false}
quarkus.log.level=${LOG_LEVEL:INFO}

# ---------------------------------------------------------------------------------------------
# Container image coordinates (Story 7); used by `mvn package -Pcontainer`.
# ---------------------------------------------------------------------------------------------
quarkus.container-image.registry=${IMAGE_REGISTRY:image-registry.openshift-image-registry.svc:5000}
quarkus.container-image.group=${IMAGE_GROUP:coolstore}
quarkus.container-image.name=coolstore
quarkus.container-image.tag=${IMAGE_TAG:latest}

# =============================================================================================
# dev profile - local development without a cluster. No audit collector, no SSO, in-memory
# messaging. PostgreSQL is expected on localhost; drop the jdbc.url below to use Dev Services.
# =============================================================================================
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/postgresDB}
%dev.quarkus.hibernate-orm.log.sql=false
%dev.audit.enabled=false
%dev.coolstore.sso-enabled=${SSO_ENABLED:false}
%dev.quarkus.oidc.tenant-enabled=false
%dev.mp.messaging.outgoing.orders-out.connector=smallrye-in-memory
%dev.mp.messaging.incoming.orders.connector=smallrye-in-memory
%dev.quarkus.log.level=INFO

# =============================================================================================
# test profile - no external services at all: H2 in PostgreSQL mode, in-memory messaging,
# no-op audit logger, OIDC disabled. The same Flyway migrations run.
# =============================================================================================
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:coolstore;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.database.generation=none
%test.quarkus.flyway.migrate-at-start=true
%test.audit.enabled=false
%test.coolstore.sso-enabled=false
%test.quarkus.oidc.tenant-enabled=false
%test.mp.messaging.outgoing.orders-out.connector=smallrye-in-memory
%test.mp.messaging.incoming.orders.connector=smallrye-in-memory
%test.quarkus.log.level=INFO
%test.quarkus.devservices.enabled=false

# =============================================================================================
# prod profile - OpenShift. No localhost defaults for anything provided by ConfigMap/Secret.
# =============================================================================================
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.audit.enabled=${AUDIT_ENABLED:true}
%prod.coolstore.sso-enabled=${SSO_ENABLED:true}
%prod.quarkus.flyway.migrate-at-start=true
%prod.quarkus.log.console.json=${LOG_JSON:true}
