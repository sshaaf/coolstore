# =====================================================================
# CoolStore monolith - Quarkus runtime configuration
# Every value can be overridden by an environment variable, e.g.
#   QUARKUS_DATASOURCE_JDBC_URL, KAFKA_BOOTSTRAP_SERVERS, AUDIT_STREAM_HOST
# =====================================================================

quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.http.root-path=/

# ---------------------------------------------------------------------
# Datasource (replaces java:jboss/datasources/CoolstoreDS)
# ---------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgresUser}
quarkus.datasource.password=${DB_PASSWORD:postgresPW}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/postgresDB}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=16

# ---------------------------------------------------------------------
# Hibernate ORM / JPA (replaces META-INF/persistence.xml)
# The schema is owned by Flyway: never let Hibernate touch it.
# ---------------------------------------------------------------------
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# ---------------------------------------------------------------------
# Flyway (replaces the Flyway 4 @Startup bean)
# ---------------------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=db/migration

# ---------------------------------------------------------------------
# Messaging: JMS topic topic/orders -> Kafka topic orders
# Two distinct consumer groups preserve JMS topic fan-out semantics:
# every order must reach BOTH the order-persistence handler and the
# inventory-notification handler.
# ---------------------------------------------------------------------
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

mp.messaging.outgoing.orders-out.connector=smallrye-kafka
mp.messaging.outgoing.orders-out.topic=orders
mp.messaging.outgoing.orders-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.incoming.orders-in.connector=smallrye-kafka
mp.messaging.incoming.orders-in.topic=orders
mp.messaging.incoming.orders-in.group.id=coolstore-order-service
mp.messaging.incoming.orders-in.auto.offset.reset=earliest
mp.messaging.incoming.orders-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.orders-in.failure-strategy=ignore

mp.messaging.incoming.orders-inventory.connector=smallrye-kafka
mp.messaging.incoming.orders-inventory.topic=orders
mp.messaging.incoming.orders-inventory.group.id=coolstore-inventory-notification
mp.messaging.incoming.orders-inventory.auto.offset.reset=earliest
mp.messaging.incoming.orders-inventory.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.orders-inventory.failure-strategy=ignore

# ---------------------------------------------------------------------
# Audit logging (audit-logging-library 2.0.0, StreamableAuditLogger/TCP)
# ---------------------------------------------------------------------
audit.stream.enabled=true
audit.stream.host=${AUDIT_STREAM_HOST:localhost}
audit.stream.port=${AUDIT_STREAM_PORT:6514}
audit.stream.protocol=TCP
audit.application=coolstore-monolith
audit.component=order-service

# ---------------------------------------------------------------------
# Health / OpenAPI / metrics
# ---------------------------------------------------------------------
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-openapi.path=/q/openapi
quarkus.micrometer.export.prometheus.path=/q/metrics

# ---------------------------------------------------------------------
# Test profile: H2 in PostgreSQL mode, in-memory messaging, no broker
# ---------------------------------------------------------------------
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:coolstore;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.hibernate-orm.database.generation=none

%test.mp.messaging.outgoing.orders-out.connector=smallrye-in-memory
%test.mp.messaging.incoming.orders-in.connector=smallrye-in-memory
%test.mp.messaging.incoming.orders-in.topic=orders
%test.mp.messaging.incoming.orders-inventory.connector=smallrye-in-memory
%test.mp.messaging.incoming.orders-inventory.topic=orders
%test.audit.stream.enabled=false
