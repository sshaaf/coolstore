# =====================================================================
# CoolStore - Quarkus runtime configuration
# All values are environment-indirected: ${ENV_VAR:default}. No secrets.
# =====================================================================

# --- HTTP -------------------------------------------------------------
quarkus.http.port=${HTTP_PORT:8080}
quarkus.http.host=0.0.0.0
quarkus.banner.enabled=false
# Preserves the legacy @ApplicationPath("/services") of RestApplication
quarkus.rest.path=/services

# --- Datasource (replaces the JTA datasource java:jboss/datasources/CoolstoreDS) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:coolstore}
quarkus.datasource.password=${DB_PASSWORD:coolstore}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/coolstore}
quarkus.datasource.jdbc.min-size=${DB_POOL_MIN:2}
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX:10}
quarkus.datasource.jdbc.acquisition-timeout=${DB_ACQUISITION_TIMEOUT:5S}
quarkus.datasource.health.enabled=true

# --- Hibernate ORM ----------------------------------------------------
# Flyway owns the schema: never let Hibernate touch DDL.
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=${HIBERNATE_LOG_SQL:false}
quarkus.hibernate-orm.jdbc.use-get-generated-keys=false
quarkus.hibernate-orm.validate-in-dev-mode=false

# --- Flyway (replaces DataBaseMigrationStartup baseline()+migrate()) ---
quarkus.flyway.migrate-at-start=${FLYWAY_MIGRATE_AT_START:true}
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1.1
quarkus.flyway.locations=db/migration

# --- Cart state (externalized, keyed by the {cartId} path parameter) ---
quarkus.redis.hosts=${REDIS_HOSTS:redis://localhost:6379}
quarkus.redis.timeout=${REDIS_TIMEOUT:2s}
cart.ttl-seconds=${CART_TTL_SECONDS:86400}
cart.key-prefix=${CART_KEY_PREFIX:cart:}

# --- Messaging: topic/orders -----------------------------------------
quarkus.artemis.url=${ARTEMIS_URL:tcp://localhost:61616}
quarkus.artemis.username=${ARTEMIS_USER:}
quarkus.artemis.password=${ARTEMIS_PASSWORD:}
quarkus.artemis.health-exclude=${ARTEMIS_HEALTH_EXCLUDE:false}
orders.topic=${ORDERS_TOPIC:topic/orders}
orders.dlq=${ORDERS_DLQ:orders.dlq}
orders.consumer.enabled=${ORDERS_CONSUMER_ENABLED:true}
orders.consumer.max-delivery-attempts=${ORDERS_MAX_DELIVERY_ATTEMPTS:5}

# --- Audit logging v2 (TCP stream, replaces local files) --------------
audit.stream.enabled=${AUDIT_STREAM_ENABLED:false}
audit.stream.host=${AUDIT_STREAM_HOST:localhost}
audit.stream.port=${AUDIT_STREAM_PORT:5044}
audit.stream.buffer-size=${AUDIT_STREAM_BUFFER_SIZE:8192}
audit.stream.reconnect-ms=${AUDIT_STREAM_RECONNECT_MS:2000}
audit.application=${AUDIT_APPLICATION:coolstore}
audit.component=${AUDIT_COMPONENT:order-service}

# --- OIDC ------------------------------------------------------------
# The legacy app only enforced login in the AngularJS SPA; the backend stays
# anonymous unless OIDC is explicitly enabled (see docs/decisions.md).
quarkus.oidc.tenant-enabled=${OIDC_ENABLED:false}
quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/eap}
quarkus.oidc.client-id=${QUARKUS_OIDC_CLIENT_ID:eap-app}

# --- Health / metrics -------------------------------------------------
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-health.ui.enable=false
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# --- Lifecycle / logging ---------------------------------------------
quarkus.shutdown.timeout=${SHUTDOWN_TIMEOUT:20s}
quarkus.log.console.json=${LOG_JSON:false}
quarkus.log.category."com.redhat.coolstore".level=${LOG_LEVEL:INFO}
quarkus.log.category."com.enterprise.audit".level=${AUDIT_LOG_LEVEL:WARN}
