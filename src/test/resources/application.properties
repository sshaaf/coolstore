# Test Configuration for Coolstore Quarkus Application

# HTTP Configuration
quarkus.http.test-port=8081

# Database Configuration - H2 In-Memory for tests
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
quarkus.datasource.username=sa
quarkus.datasource.password=

# Hibernate ORM Configuration for tests
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=no-file

# Flyway Configuration for tests
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.clean-at-start=false

# Logging Configuration
quarkus.log.console.enable=true
quarkus.log.level=INFO
quarkus.log.category."com.redhat.coolstore".level=DEBUG
quarkus.log.category."io.quarkus".level=WARN

# Disable health checks in tests for faster startup
quarkus.health.extensions.enabled=false

# Reactive Messaging Configuration for tests
# Use in-memory connector (auto-configured for matching channels)

# OpenAPI/Swagger - disable in tests
quarkus.swagger-ui.always-include=false

# Speed up tests
quarkus.arc.remove-unused-beans=false
quarkus.hibernate-orm.jdbc.statement-batch-size=50

# Transaction timeout for tests
quarkus.transaction-manager.default-transaction-timeout=60

# Enable JNDI for ShoppingCartService
quarkus.naming.enable-jndi=true
